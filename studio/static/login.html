<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JUGAAD — sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,600&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/app.css?v=18" />
</head>
<body class="auth-body">
  <div class="grain" aria-hidden="true"></div>
  <main class="auth-wrap">
    <div class="brand auth-brand">
      <span class="mark">J</span>
      <div>
        <strong>JUGAAD</strong>
        <em>faceless studio <span class="beta">beta</span></em>
      </div>
    </div>
    <div class="auth-card">
      <p class="dialog-kicker" id="authKicker">Account</p>
      <h1 id="authTitle">Sign in</h1>
      <p class="dialog-copy" id="authCopy">Use your desk. Keys stay on this machine, per account.</p>
      <form id="authForm">
        <label class="field" id="nameField" hidden>
          <span>Name</span>
          <input id="name" type="text" maxlength="48" autocomplete="name" disabled />
        </label>
        <label class="field">
          <span>Email</span>
          <input id="email" type="email" required autocomplete="email" />
        </label>
        <label class="field">
          <span>Password</span>
          <input id="password" type="password" required minlength="8" autocomplete="current-password" />
        </label>
        <p class="auth-error" id="authError" hidden></p>
        <button class="go auth-go" type="submit" id="authSubmit">Sign in</button>
      </form>
      <p class="auth-switch">
        <button type="button" id="authToggle">Need an account? Create one</button>
      </p>
    </div>
  </main>
  <script src="/login.js?v=4"></script>
</body>
</html>
