databases:
  - name: jugaad-db
    databaseName: jugaad
    plan: free
    region: singapore

services:
  - type: web
    name: jugaad
    runtime: python
    plan: free
    region: singapore
    healthCheckPath: /api/health
    buildCommand: pip install -r requirements-web.txt
    startCommand: python studio.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: JUGAAD_DISABLE_GENERATE
        value: "1"
      - key: JUGAAD_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: jugaad-db
          property: connectionString
