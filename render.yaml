# Auth DB is Neon (DATABASE_URL), not Render Postgres.
# Local generate still uses SQLite unless DATABASE_URL is set.

services:
  - type: web
    name: jugaad
    runtime: python
    plan: free
    region: singapore
    healthCheckPath: /api/health
    buildCommand: pip install --upgrade pip && pip install "setuptools<81" wheel && pip install -r requirements-web.txt
    startCommand: python studio.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: JUGAAD_DISABLE_GENERATE
        value: "1"
      - key: JUGAAD_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
