# Install CI deps, lint, and run unit tests on push/PR to main.
name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        python -m pip install flake8 pytest
        pip install -r requirements-ci.txt
    - name: Lint with flake8
      run: |
        # Fail on syntax errors / undefined names in project code only.
        flake8 \
          --count --select=E9,F63,F7,F82 --show-source --statistics \
          --exclude=venv,.venv,assets,jobs,output,scripts,.git \
          .
        flake8 \
          --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics \
          --exclude=venv,.venv,assets,jobs,output,scripts,.git \
          .
    - name: Test with pytest
      run: |
        pytest tests/ -q
